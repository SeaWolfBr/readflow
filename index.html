<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadFlow - Configuração</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>ReadFlow</h1>
    <p>Configure seu exercício de leitura:</p>

    <label for="language">Idioma do texto:</label>
    <select id="language">
      <option value="pt">Português</option>
      <option value="en">Inglês</option>
      <option value="es">Espanhol</option>
      <option value="zh">Chinês</option>
    </select>

    <label for="time">Tempo de leitura (em segundos):</label>
    <input type="number" id="time" min="30" step="10" value="300" />

    <label for="topic">Tema da leitura:</label>
    <input type="text" id="topic" placeholder="Ex: Meio ambiente, História..." />

    <button id="startBtn">Começar Leitura</button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
