<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leitura | ReadFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Leitura</h1>
    <p><strong>Idioma:</strong> <span id="idioma"></span> |
        <strong>Tema:</strong> <span id="tema"></span> |
        <strong>Tempo:</strong> <span id="tempo"></span> segundos</p>
     <p id="cronometro" style="font-weight: bold; margin-bottom: 20px; display: none;">Tempo: 0s</p>
     

    <div id="texto-container">
      <p id="texto">Gerando texto, aguarde...</p>
    </div>

    <button id="finalizarLeitura">Terminei a leitura</button>
  </div>

  <script src="js/leitura.js"></script>
</body>
</html>
